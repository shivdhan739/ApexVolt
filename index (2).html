<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexVolt Neo-Bank - Home</title>
    <style>
        :root {
            --primary: #ffd700;
            --background: #121212;
            --surface: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --border: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .bank-container {
            background: var(--surface);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid var(--border);
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: pulse 2s infinite alternate;
        }

        h1 {
            font-size: 1.8rem;
            margin: 10px 0;
            font-weight: 700;
        }

        p {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        .logout-btn {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.2);
        }

        .logout-btn:hover {
            background-color: var(--danger-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(231, 76, 60, 0.4);
        }

        .logout-btn:active {
            transform: translateY(0);
        }

        .logout-btn:disabled {
            background-color: #555555;
            color: #888888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <div class="bank-container">
        <div class="logo">⚡</div>
        <h1>ApexVolt Neo-Bank</h1>
        <p>Welcome to your secure digital banking session.</p>
        
        <!-- Sign Out Action Target Component -->
        <button id="apexLogoutBtn" class="logout-btn">Sign Out</button>
    </div>

    <!-- Firebase v10 SDK Core Infrastructure Modules -->
    <script type="module">
        // Import modular Firebase initialization and verification elements
        import { initializeApp, getApps } from "https://gstatic.com";
        import { getAuth, signOut } from "https://gstatic.com";
        
        // ============================================================================
        // ⚠️ CRITICAL STEP FOR GITHUB: PASTE YOUR OWN FIREBASE CONFIGURATION OBJECT HERE
        // ============================================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE",
            authDomain: "YOUR_AUTH_DOMAIN_HERE",
            projectId: "YOUR_PROJECT_ID_HERE",
            storageBucket: "YOUR_STORAGE_BUCKET_HERE",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID_HERE",
            appId: "YOUR_APP_ID_HERE"
        };

        // Initialize Firebase app securely if it hasn't been initialized already
        let app;
        if (!getApps().length) {
            app = initializeApp(firebaseConfig);
        } else {
            app = getApps()[0];
        }

        // Connect securely to the Firebase client state engine
        const auth = getAuth(app);

        // Bind interactive event targeting our DOM element UI component
        const logoutButton = document.getElementById('apexLogoutBtn');

        if (logoutButton) {
            logoutButton.addEventListener('click', () => {
                // Safeguard against subsequent event stacking during network handshakes
                logoutButton.disabled = true;
                logoutButton.innerText = "Signing out safely...";

                // Execute safe client detachment from the auth state token
                signOut(auth)
                    .then(() => {
                        console.log("ApexVolt Client Status: Successfully disconnected from Firebase Session.");
                        
                        // Wipe residual variables, cookies, and local engine cache strings cleanly
                        localStorage.clear();
                        sessionStorage.clear();

                        // Redirect structural viewpoint back to public routing fallback asset.
                        // If your custom landing page is different from 'login.html', update the string route name below:
                        window.location.href = "login.html"; 
                    })
                    .catch((error) => {
                        console.error("ApexVolt Framework Signout Interrupt Event Trace:", error.message);
                        alert("Sign out routing execution failed: " + error.message);
                        
                        // Failback error boundary reset to restore user controls
                        logoutButton.disabled = false;
                        logoutButton.innerText = "Sign Out";
                    });
            });
        }
    </script>
</body>
</html>
